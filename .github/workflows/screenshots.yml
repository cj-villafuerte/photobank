name: App Store screenshots (iOS simulator)

# Manual. Boots an iPhone 16 Pro Max simulator (1320x2868 = Apple's 6.9" size), drives the
# real app against the demo server (integration_test/screenshots_test.dart) and saves the
# captures to mobile/fastlane/screenshots/en-US/. Downloads as an artifact; with
# upload=true they also go straight to App Store Connect via the fastlane `screenshots` lane.
on:
  workflow_dispatch:
    inputs:
      server:
        description: "Photobank server to capture against"
        required: false
        default: "https://photobank-demo-production.up.railway.app"
      upload:
        description: "Upload to App Store Connect afterwards"
        type: boolean
        default: false

concurrency: appstore-screenshots

jobs:
  capture:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    env:
      BUNDLE_ID: com.cjvillafuerte.photobank
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for devs in json.load(sys.stdin)["devices"].values() for d in devs]
          want = ["iPhone 16 Pro Max", "iPhone 15 Pro Max", "iPhone 17 Pro Max"]
          pick = sorted((d for d in devs if d["name"] in want), key=lambda d: want.index(d["name"]))
          if not pick:
              sys.exit("no Pro Max simulator available: " + ", ".join(sorted({d["name"] for d in devs})))
          print(pick[0]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID"

      - name: Build the test app for the simulator
        run: |
          flutter build ios --simulator --debug \
            --target integration_test/screenshots_test.dart \
            --dart-define=PB_SERVER="${{ inputs.server }}"

      # The simulator runtime ignores `simctl privacy grant photos` (only photos-add
      # registers), so the photo-permission dialog is answered like a person would:
      # idb reads the accessibility tree and taps "Allow Full Access".
      - name: Install idb (taps system dialogs)
        run: |
          brew tap facebook/fb >/dev/null
          brew trust facebook/fb >/dev/null 2>&1 || true   # newer Homebrew refuses untrusted taps
          brew install facebook/fb/idb-companion >/dev/null 2>&1 || brew install facebook/fb/idb-companion
          pipx install fb-idb >/dev/null 2>&1 || python3 -m pip install --user --break-system-packages fb-idb
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v idb || ls ~/.local/bin

      # Install, grant photo access, and launch the app ourselves. `flutter drive` would
      # reinstall the app (wiping the grant) and race the launch; instead the app starts
      # with a fixed VM-service port and the driver attaches to it (--use-existing-app).
      - name: Install, grant photo access, launch
        run: |
          APP=build/ios/iphonesimulator/Runner.app
          xcrun simctl install "$UDID" "$APP"
          # A privacy grant only sticks once the app has launched at least once (the
          # simulator ignores grants for apps TCC has never seen). So: launch, let it
          # register, terminate, grant, and only then launch for the capture. Grant
          # `photos` alone - `photos-add` afterwards downgrades it to add-only.
          xcrun simctl launch "$UDID" "$BUNDLE_ID" >/dev/null
          sleep 12
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2
          xcrun simctl privacy "$UDID" grant photos "$BUNDLE_ID"
          # a clean, believable status bar for the captures
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          mkdir -p diag
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "Runner" OR eventMessage CONTAINS "Photobank"' > diag/sim-app.log 2>&1 &
          echo "LOGPID=$!" >> "$GITHUB_ENV"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            --enable-dart-profiling --disable-service-auth-codes \
            --vm-service-port=54321 --observatory-port=54321
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:54321/" >/dev/null 2>&1 && { echo "VM service up after ${i}s"; break; }
            sleep 1
          done

      - name: Drive the app and capture
        timeout-minutes: 15
        run: |
          rm -rf fastlane/screenshots/en-US
          cat > diag/tap_allow.py <<'EOF'
          # Polls the simulator's accessibility tree and taps the photo-permission
          # dialog's "Allow Full Access" (or "Allow"/"OK") as soon as it shows up.
          import json, os, subprocess, sys, time
          udid = os.environ["UDID"]
          wanted = ("Allow Full Access", "Allow Access to All Photos", "Allow", "OK")
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  out = subprocess.run(["idb", "ui", "describe-all", "--udid", udid, "--json"],
                                       capture_output=True, text=True, timeout=20).stdout
                  items = json.loads(out) if out.strip().startswith("[") else [json.loads(l) for l in out.splitlines() if l.strip()]
                  for it in items:
                      label = str(it.get("AXLabel") or it.get("title") or "")
                      if label in wanted:
                          f = it["frame"]
                          x, y = f["x"] + f["width"] / 2, f["y"] + f["height"] / 2
                          subprocess.run(["idb", "ui", "tap", "--udid", udid, str(int(x)), str(int(y))], timeout=20)
                          print(f"tapped '{label}' at {int(x)},{int(y)}", flush=True)
                          sys.exit(0)
              except Exception as e:  # idb still warming up, or no dialog yet
                  print("tapper:", type(e).__name__, str(e)[:120], flush=True)
              time.sleep(2)
          print("tapper: no permission dialog seen (fine if the grant worked)", flush=True)
          EOF
          python3 diag/tap_allow.py > diag/tapper.log 2>&1 &
          TAPPID=$!
          set +e
          flutter drive -v \
            --use-existing-app=http://127.0.0.1:54321/ \
            --driver test_driver/integration_test.dart \
            --target integration_test/screenshots_test.dart \
            --dart-define=PB_SERVER="${{ inputs.server }}" \
            -d "$UDID" > diag/flutter-drive.log 2>&1
          RC=$?
          set -e
          kill $TAPPID $LOGPID 2>/dev/null || true
          echo "--- tapper ---"; cat diag/tapper.log || true
          xcrun simctl io "$UDID" screenshot diag/simulator-at-end.png || true
          grep -E "saved fastlane|All tests passed|Some tests failed|Exception|Error|error" diag/flutter-drive.log | head -60 || true
          ls -la fastlane/screenshots/en-US 2>/dev/null || echo "no screenshots written"
          python3 - <<'EOF'
          import struct, glob
          for p in sorted(glob.glob("fastlane/screenshots/en-US/*.png")):
              with open(p, "rb") as f:
                  f.seek(16); w, h = struct.unpack(">II", f.read(8))
              print(f"{p}: {w}x{h}")
          EOF
          exit $RC

      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshot-run-diagnostics
          path: |
            mobile/diag/*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: appstore-screenshots
          path: mobile/fastlane/screenshots/en-US/*.png
          if-no-files-found: error

      - uses: ruby/setup-ruby@v1
        if: ${{ inputs.upload }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane ios screenshots
