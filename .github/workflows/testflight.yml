name: TestFlight (signed iOS build + upload)

# Manual: Actions > TestFlight > Run workflow. Setup and secrets: mobile/TESTFLIGHT.md
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (CFBundleVersion). Empty = this run's number."
        required: false
        default: ""

concurrency: testflight

jobs:
  testflight:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # optional; the `secrets` context can't be used in a step `if`, so it's mirrored here
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check secrets
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          missing=()
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (see mobile/TESTFLIGHT.md)"; exit 1
          fi

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$ASC_API_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # Optional. Without it Xcode uses a cloud-managed "Apple Distribution" certificate
      # (the API key needs the App Manager or Admin role for that). With it, the exported
      # .p12 is imported into a throwaway keychain and Xcode signs with that instead.
      - name: Install distribution certificate (optional)
        if: env.IOS_DIST_CERT_P12_BASE64 != ''
        env:
          P12_BASE64: ${{ env.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/dist.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build number
        run: |
          N="${{ github.event.inputs.build_number }}"
          [ -n "$N" ] || N="${{ github.run_number }}"
          echo "BUILD_NUMBER=$N" >> "$GITHUB_ENV"
          echo "Build number: $N"

      - run: flutter pub get

      - name: Flutter build (no codesign; installs pods, writes Generated.xcconfig)
        run: flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER"

      - name: Export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF

      - name: Archive (Xcode automatic signing via API key)
        run: |
          LOG="$RUNNER_TEMP/archive.log"
          if ! xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" > "$LOG" 2>&1; then
            grep -E "error:|error " "$LOG" | head -60
            echo "::error::xcodebuild archive failed (full log in the step above)"
            tail -80 "$LOG"
            exit 1
          fi
          grep -E "warning: .*(sign|provision)|\*\* ARCHIVE" "$LOG" || true

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It appears in App Store Connect > TestFlight after processing (5-15 min)."

      - name: Keep dSYMs (crash symbolication)
        uses: actions/upload-artifact@v5
        with:
          name: photobank-ios-dSYMs-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/Runner.xcarchive/dSYMs
          retention-days: 90
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          rm -f ~/private_keys/AuthKey_*.p8
          [ -f "$RUNNER_TEMP/signing.keychain-db" ] && security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
