name: Release (Windows + macOS + iOS)

# Tags v* -> a versioned release (what the website's download buttons point at via
# /releases/latest). Every push to main that touches an app -> the rolling "dev"
# pre-release is rebuilt, so a current build is always downloadable too.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "mobile/**"
      - "scripts/build-desktop.*"
      - "scripts/macos-entitlements.plist"
      - "assets/icon/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Build Photobank.exe
        shell: pwsh
        run: |
          Set-Location web; npm ci --no-audit --no-fund; Set-Location ..
          py -m venv server\.venv
          & server\.venv\Scripts\python.exe -m pip install --quiet --disable-pip-version-check -r server\requirements.txt
          .\scripts\build-desktop.ps1
          Compress-Archive -Path server\dist\Photobank\* -DestinationPath Photobank-Windows.zip
      - uses: actions/upload-artifact@v5
        with: { name: photobank-windows, path: Photobank-Windows.zip }

  macos:
    runs-on: macos-latest
    env:
      MAC_DEV_ID_P12_BASE64: ${{ secrets.MAC_DEV_ID_P12_BASE64 }}
      MAC_DEV_ID_P12_PASSWORD: ${{ secrets.MAC_DEV_ID_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Developer ID certificate (optional)
        if: env.MAC_DEV_ID_P12_BASE64 != ''
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/devid.p12"; KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$MAC_DEV_ID_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$MAC_DEV_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$IDENTITY" ] || { echo "::error::no 'Developer ID Application' identity in the .p12"; exit 1; }
          echo "MAC_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$ASC_API_KEY_P8_BASE64" ]; then
            mkdir -p ~/private_keys
            echo -n "$ASC_API_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
            echo "NOTARY_KEY_PATH=$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
            echo "NOTARY_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
            echo "NOTARY_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
          fi
      - run: bash scripts/build-desktop.sh
      - run: cd server/dist && ditto -c -k --sequesterRsrc --keepParent Photobank.app ../../Photobank-macOS.zip
      - uses: actions/upload-artifact@v5
        with: { name: photobank-macos, path: Photobank-macOS.zip }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p Payload && cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ../Photobank-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        with: { name: photobank-ios, path: Photobank-iOS-unsigned.ipa }

  release:
    needs: [windows, macos, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v5
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Photobank-Windows.zip
            Photobank-macOS.zip
            Photobank-iOS-unsigned.ipa
          generate_release_notes: true

  # main: move the `dev` tag to this commit and replace the pre-release's assets
  dev-build:
    needs: [windows, macos, ios]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - name: Point the dev tag at this commit
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push -f origin refs/tags/dev
      - uses: actions/download-artifact@v5
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development build
          prerelease: true
          body: |
            The newest build of `main` (${{ github.sha }}), refreshed on every push.
            Not a release: for the stable version use the latest tagged release.
          files: |
            Photobank-Windows.zip
            Photobank-macOS.zip
            Photobank-iOS-unsigned.ipa
