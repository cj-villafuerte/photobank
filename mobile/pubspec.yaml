name: photobank_mobile
description: Photobank sync companion - backs up your camera roll to your own server.
publish_to: "none"
# build number (+N) is overridden by the TestFlight workflow (run number); for a
# local upload pick one higher than the last build App Store Connect has seen
version: 0.2.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  photo_manager: ^3.6.4
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6
  convert: ^3.1.1
  url_launcher: ^6.3.1
  bonsoir: ^5.1.0
  path_provider: ^2.1.5
  video_player: ^2.9.2
  background_fetch: ^1.3.7
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^18.0.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
